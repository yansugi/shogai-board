# 障害情報ボード（ShogaiBoard）用 Nginx リバースプロキシ設定
# 配置先の例: /etc/nginx/sites-available/shogai-board.conf
#   sudo ln -s /etc/nginx/sites-available/shogai-board.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    # イントラ内のホスト名・IPに合わせて変更する
    server_name shogai-board.internal;

    location / {
        proxy_pass          http://127.0.0.1:5243;
        proxy_http_version  1.1;

        proxy_set_header    Host              $host;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;

        # Kestrel側の接続を使い回すための設定
        proxy_set_header    Connection        keep-alive;
        proxy_cache_bypass  $http_upgrade;
    }
}
